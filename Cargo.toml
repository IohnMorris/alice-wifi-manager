[package]
name = "alice-wifi-manager"
version = "2.1.0"
edition = "2021"
description = "Autonomous Wi-Fi Provisioning Manager for Yandex Station Mini 2"

[dependencies]
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
dhcproto = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true