name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Verify Zig toolchain
        run: zig version
      - uses: taiki-e/install-action@cargo-zigbuild
      - name: Require verified wpa_supplicant artifact
        env:
          EXPECTED_SHA256: 3e7a5dd461d24fa72e8cc9ab53f1a2274f2df61a14a5ffe8cdb8b0f8d151f3bc
        run: |
          set -eu
          test -f artifacts/armv7/wpa_supplicant
          actual="$(sha256sum artifacts/armv7/wpa_supplicant | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
      - name: Build manager
        run: cargo zigbuild --release --target armv7-unknown-linux-musleabihf
      - name: Package release
        run: |
          set -eu
          mkdir -p dist/alice-wifi-manager
          cp target/armv7-unknown-linux-musleabihf/release/alice-wifi-manager dist/alice-wifi-manager/
          cp artifacts/armv7/wpa_supplicant dist/alice-wifi-manager/
          cp scripts/S99z-wifi-manager dist/alice-wifi-manager/
          cp -r scripts docs README.md CHANGELOG.md dist/alice-wifi-manager/
          tar -C dist -czf "alice-wifi-manager-${GITHUB_REF_NAME}-armv7.tar.gz" alice-wifi-manager
          cp "alice-wifi-manager-${GITHUB_REF_NAME}-armv7.tar.gz" alice-wifi-manager-armv7.tar.gz
          sha256sum "alice-wifi-manager-${GITHUB_REF_NAME}-armv7.tar.gz" \
            alice-wifi-manager-armv7.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            alice-wifi-manager-${{ github.ref_name }}-armv7.tar.gz
            alice-wifi-manager-armv7.tar.gz
            SHA256SUMS
