name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: armv7-unknown-linux-musleabihf,x86_64-unknown-linux-gnu
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check ARMv7 target
        run: cargo check --target armv7-unknown-linux-musleabihf
      - name: Run tests
        run: cargo test --target x86_64-unknown-linux-gnu

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          set -eu
          for file in scripts/*.sh; do
            sh -n "$file"
          done
      - name: Check transactional installer invariants
        run: |
          set -eu
          test -s scripts/transaction-install.sh
          grep -q 'alice-wifi-manager.install.lock' scripts/transaction-install.sh
          grep -q 'MANIFEST.sha256' scripts/transaction-install.sh
          grep -q 'rollback' scripts/transaction-install.sh
          ! grep -q 'mv /tmp/alice-wifi-manager /usr/bin' scripts/*.ps1
          ! grep -q 'sync_data()' src/wpa_ctrl.rs
      - name: Validate embedded web page
        run: test -s web/index.html
